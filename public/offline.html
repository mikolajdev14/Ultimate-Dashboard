<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultimate Dashboard offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #060713;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.05);
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jestes offline</h1>
      <p>
        Ultimate Dashboard zapisuje shell aplikacji w cache. Wroc online, aby
        zsynchronizowac najnowsze dane z Supabase.
      </p>
    </main>
  </body>
</html>
